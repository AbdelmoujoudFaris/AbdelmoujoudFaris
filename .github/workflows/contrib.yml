name: Update contribution graph
on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/contrib_svg.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib.svg
          git diff --cached --quiet || (git commit -m "Update contribution graph" && git push)
